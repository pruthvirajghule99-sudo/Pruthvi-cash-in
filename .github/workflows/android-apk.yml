
name: Build Pruthvi Cash APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform and Build Tools
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android project
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: Android project settings file missing."
            exit 1
          fi
          if [ ! -d app ]; then
            echo "ERROR: app module folder missing."
            exit 1
          fi

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: Add SUPABASE_URL and SUPABASE_ANON_KEY as repository Actions secrets."
            exit 1
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug \
              -PSUPABASE_URL="$SUPABASE_URL" \
              -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          else
            gradle --no-daemon assembleDebug \
              -PSUPABASE_URL="$SUPABASE_URL" \
              -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          fi

      - name: Verify APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pruthvi-Cash-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
